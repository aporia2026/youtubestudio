name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel in-progress runs for the same branch when a new commit arrives —
# saves Actions minutes on free-tier and keeps PR feedback fresh.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      # Errors fail the job. Warnings (legacy React-19 patterns, JSX entity
      # escapes, unused vars in Remotion scenes) stay visible in the run
      # output without blocking. Promote individual rules back to "error"
      # in eslint.config.mjs as the codebase is cleaned up.
      - run: npm run lint -- --max-warnings 9999

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run test
        env:
          # Tests need an AUTH_SECRET to verify the JWT roundtrip; the value
          # below is a fixed test-only secret with no production meaning.
          AUTH_SECRET: ci-only-do-not-use-in-prod-${{ github.run_id }}-xxxxxxxxxxxxxx

  # Full Next.js build. Catches issues that pure typecheck misses:
  # Server Component constraints, route-handler signatures, App Router
  # `params` shape changes, dynamic-vs-static rendering errors,
  # client/server boundary leaks, and Turbopack-vs-webpack divergence.
  #
  # Added 2026-06-10 after three Vercel deployments errored on a missing
  # import that this job would have caught locally. Vercel deployments
  # fire on every push regardless of GitHub Actions outcome, so use a
  # branch protection rule (Settings → Branches → require status checks)
  # to make this an actual gate on PR merges.
  #
  # Env vars: Next.js doesn't connect to external services during a
  # static `next build`, but the build DOES need any env vars referenced
  # at module-import time (e.g. `process.env.X` inlined as a constant).
  # The placeholders below are the minimum set needed for the build to
  # parse + render every route; they're test-only stubs with no
  # production meaning. Add more here as `next build` reports
  # missing-variable errors.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          # Same fixed test-only secret as the `test` job. Required at
          # build time because the JWT helper reads it from module scope.
          AUTH_SECRET: ci-only-do-not-use-in-prod-${{ github.run_id }}-xxxxxxxxxxxxxx
          # Suppresses Next.js telemetry pings during the build.
          NEXT_TELEMETRY_DISABLED: '1'
